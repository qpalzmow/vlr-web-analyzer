name: Hourly VLR data
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/hourly-data.yml'
      - 'app/**'
      - 'requirements.txt'
      - 'tier_config.json'
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      check_source:
        description: 'Check public match clock parsing without publishing data'
        type: boolean
        default: false
      catalog_only:
        description: 'Refresh match context only; keep prepared team analysis'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: hourly-vlr-data
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      VLR_DATA_DIR: ${{ github.workspace }}/.collector-data
      VLR_REFRESH_MODE: local
      VLR_REQUEST_INTERVAL_SECONDS: '1.0'
    steps:
      - name: Start shared job budget
        shell: bash
        run: |
          python3 - <<'PY'
          import os, time
          start = time.monotonic()
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'COLLECTOR_JOB_STARTED={start}\nCOLLECTOR_JOB_DEADLINE={start + 3300}\n')
          PY
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        timeout-minutes: 5
        run: python -m pip install -r requirements.txt
      - name: Check source clock
        if: ${{ inputs.check_source == true }}
        run: |
          python - <<'PY'
          from bs4 import BeautifulSoup
          from app.scraper.http import request_with_retry
          from app.scraper.parsers import parse_scheduled_time
          response = request_with_retry('https://www.vlr.gg/753451')
          response.raise_for_status()
          soup = BeautifulSoup(response.text, 'html.parser')
          print(soup.select_one('.match-header-date'))
          print(parse_scheduled_time(soup))
          PY
      - name: Restore previous published generation
        if: ${{ inputs.check_source != true }}
        shell: bash
        run: |
          code=0
          timeout --kill-after=5s 30s git ls-remote --exit-code --heads origin catalog-data || code=$?
          case "$code" in
            0)
              timeout --kill-after=5s 30s git fetch origin catalog-data
              git worktree add --detach "$RUNNER_TEMP/published" FETCH_HEAD
              ;;
            2)
              mkdir -p "$RUNNER_TEMP/published"
              git -C "$RUNNER_TEMP/published" init -b catalog-data
              ;;
            *) exit "$code" ;;
          esac
      - name: Check whether collection is due
        id: due
        if: ${{ inputs.check_source != true }}
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          due=true
          if [ "$EVENT_NAME" = "schedule" ]; then
            due=$(python -m app.snapshot_export --check-due --previous "$RUNNER_TEMP/published/snapshot.json")
          fi
          echo "collect=$due" >> "$GITHUB_OUTPUT"
          if [ "$due" != "true" ]; then
            echo "Collection is not due: completed data uses one hour; unsuccessful stages retry after 15 minutes." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Restore collector cache
        id: collector-cache
        if: ${{ steps.due.outputs.collect == 'true' }}
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .collector-data
          key: vlr-collector-v3-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vlr-collector-v3-${{ runner.os }}-
            vlr-collector-v2-${{ runner.os }}-
      - name: Recover verified collector checkpoint
        if: ${{ steps.due.outputs.collect == 'true' }}
        shell: bash
        run: |
          python -m app.collector_runner --stage recover --output "$RUNNER_TEMP/snapshot.json" --previous "$RUNNER_TEMP/published/snapshot.json"
      - name: Prepare snapshot publisher
        if: ${{ steps.due.outputs.collect == 'true' }}
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/publish-snapshot.sh" <<'BASH'
          set -euo pipefail
          timeout --kill-after=2s 20s python -m app.collector_runner --validate-publish "$RUNNER_TEMP/snapshot.json"
          cp "$RUNNER_TEMP/snapshot.json" "$RUNNER_TEMP/published/snapshot.json"
          cd "$RUNNER_TEMP/published"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshot.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update prepared VLR data"
          if git remote get-url origin >/dev/null 2>&1; then
            timeout --kill-after=5s 35s git push origin HEAD:catalog-data
          else
            # Use checkout's existing scoped credential configuration.
            timeout --kill-after=5s 35s git -C "$GITHUB_WORKSPACE" fetch "$RUNNER_TEMP/published" catalog-data
            timeout --kill-after=5s 35s git -C "$GITHUB_WORKSPACE" push origin FETCH_HEAD:catalog-data
          fi
          BASH
      - name: Collect match catalog under a process limit
        id: catalog
        if: ${{ steps.due.outputs.collect == 'true' }}
        shell: bash
        run: |
          code=0
          python -m app.collector_runner --stage catalog --output "$RUNNER_TEMP/snapshot.json" --previous "$RUNNER_TEMP/published/snapshot.json" || code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
      - name: Recover interrupted catalog checkpoint
        id: catalog-finalize
        if: ${{ steps.catalog.outputs.exit_code != '' && steps.catalog.outputs.exit_code != '0' }}
        shell: bash
        env:
          COLLECTOR_EXIT_CODE: ${{ steps.catalog.outputs.exit_code }}
        run: |
          code=0
          python -m app.collector_runner --stage finalize --interrupted-stage catalog --exit-code "$COLLECTOR_EXIT_CODE" --output "$RUNNER_TEMP/snapshot.json" --previous "$RUNNER_TEMP/published/snapshot.json" || code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
      - name: Publish validated catalog or retained previous generation
        id: catalog-publish
        if: ${{ steps.catalog.outputs.exit_code != '' }}
        shell: bash
        env:
          COLLECTOR_EXIT_CODE: ${{ steps.catalog.outputs.exit_code }}
          FINALIZE_EXIT_CODE: ${{ steps.catalog-finalize.outputs.exit_code }}
        run: |
          bash "$RUNNER_TEMP/publish-snapshot.sh"
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = json.loads((Path(os.environ['RUNNER_TEMP']) / 'snapshot.json').read_text())
          result = payload.get('collection', {}).get('catalog', {})
          status = result.get('status', 'legacy')
          can_analyze = (status in ('completed', 'partial') and os.environ['COLLECTOR_EXIT_CODE'] in ('0', '124')
                         and os.environ['FINALIZE_EXIT_CODE'] in ('', '0'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"run_analysis={str(can_analyze).lower()}\n")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"Catalog: {status}; data clock: {payload['catalog']['updated_at']}; "
                            f"generation: {payload['catalog']['generation']}; exit code: {os.environ['COLLECTOR_EXIT_CODE']}\n\n")
          if status != 'completed':
              print(f'::warning::Catalog is {status}; its actual data clock and verified checkpoint were preserved.')
          if not can_analyze:
              print('Analysis skipped: no newly accepted complete/partial catalog, or catalog recovery failed.')
          PY
      - name: Collect incremental analysis under the remaining job budget
        id: analysis
        if: ${{ steps.catalog-publish.outputs.run_analysis == 'true' && inputs.catalog_only != true }}
        shell: bash
        run: |
          code=0
          python -m app.collector_runner --stage analysis --output "$RUNNER_TEMP/snapshot.json" --previous "$RUNNER_TEMP/published/snapshot.json" || code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
      - name: Recover interrupted analysis checkpoint
        id: analysis-finalize
        if: ${{ steps.analysis.outputs.exit_code != '' && steps.analysis.outputs.exit_code != '0' }}
        shell: bash
        env:
          COLLECTOR_EXIT_CODE: ${{ steps.analysis.outputs.exit_code }}
        run: |
          code=0
          python -m app.collector_runner --stage finalize --interrupted-stage analysis --exit-code "$COLLECTOR_EXIT_CODE" --output "$RUNNER_TEMP/snapshot.json" --previous "$RUNNER_TEMP/published/snapshot.json" || code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
      - name: Publish completed analysis or verified checkpoint
        if: ${{ steps.analysis.outputs.exit_code != '' }}
        shell: bash
        env:
          COLLECTOR_EXIT_CODE: ${{ steps.analysis.outputs.exit_code }}
        run: |
          bash "$RUNNER_TEMP/publish-snapshot.sh"
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = json.loads((Path(os.environ['RUNNER_TEMP']) / 'snapshot.json').read_text())
          collection = payload.get('collection', {})
          result = collection.get('analysis', {})
          status = result.get('status', collection.get('status', 'unknown'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"Analysis: {status}; results: {result.get('results', collection.get('results', {}))}; "
                            f"exit code: {os.environ['COLLECTOR_EXIT_CODE']}\n\n")
          if status != 'completed' or os.environ['COLLECTOR_EXIT_CODE'] != '0':
              print('::warning::Analysis is partial or interrupted; only verified data was published.')
          PY
      - name: Report unexpected collection or recovery failures
        if: ${{ always() && steps.due.outputs.collect == 'true' }}
        shell: bash
        env:
          CATALOG_EXIT_CODE: ${{ steps.catalog.outputs.exit_code }}
          ANALYSIS_EXIT_CODE: ${{ steps.analysis.outputs.exit_code }}
          CATALOG_FINALIZE_EXIT_CODE: ${{ steps.catalog-finalize.outputs.exit_code }}
          ANALYSIS_FINALIZE_EXIT_CODE: ${{ steps.analysis-finalize.outputs.exit_code }}
        run: |
          python - <<'PY'
          import os
          failures = []
          for key in ('CATALOG_EXIT_CODE', 'ANALYSIS_EXIT_CODE'):
              if os.environ[key] not in ('', '0', '124'):
                  failures.append(f'{key}={os.environ[key]}')
          for key in ('CATALOG_FINALIZE_EXIT_CODE', 'ANALYSIS_FINALIZE_EXIT_CODE'):
              if os.environ[key] not in ('', '0'):
                  failures.append(f'{key}={os.environ[key]}')
          if failures:
              raise SystemExit('Unexpected failure after checkpoint publication: ' + ', '.join(failures))
          PY
      - name: Save reusable collector cache
        if: ${{ always() && steps.due.outputs.collect == 'true' && steps.collector-cache.outcome == 'success' }}
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .collector-data
          key: vlr-collector-v3-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
